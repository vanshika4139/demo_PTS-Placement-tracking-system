{% extends 'base.html' %}
{% set show_sidebar = false %}
{% set show_navbar = false %}

{% block title %}Forgot Password - Codevocado{% endblock %}

{% block content %}
<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark large">C</div>
      <h1>Codevocado</h1>
      <p>Reset your password</p>
    </div>

    <form class="auth-form" method="post">
      <label for="email">Enter your registered email</label>
      <input id="email" name="email" type="email" required>

      <button type="submit" class="primary-btn">Send OTP</button>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    </form>

    <p style="text-align:center; margin-top: 16px;">
      <a href="{{ url_for('frontend.login') }}">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}

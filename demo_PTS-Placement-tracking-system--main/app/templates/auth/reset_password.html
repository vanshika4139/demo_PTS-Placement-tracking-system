{% extends 'base.html' %}
{% set show_sidebar = false %}
{% set show_navbar = false %}

{% block title %}Reset Password - Codevocado{% endblock %}

{% block content %}
<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark large">C</div>
      <h1>Codevocado</h1>
      <p>Set your new password</p>
    </div>

    <form class="auth-form" method="post">
      <label for="new_password">New Password</label>
      <div class="password-field-wrapper">
        <input id="new_password" name="new_password" type="password" required>
        <span id="toggleNewPassword" class="password-toggle-icon">👁️</span>
      </div>

      <label for="confirm_password">Confirm Password</label>
      <div class="password-field-wrapper">
        <input id="confirm_password" name="confirm_password" type="password" required>
        <span id="toggleConfirmPassword" class="password-toggle-icon">👁️</span>
      </div>

      <button type="submit" class="primary-btn">Reset Password</button>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    </form>
  </div>
</div>

<style>
  .password-field-wrapper { position: relative; width: 100%; }
  .password-field-wrapper input { width: 100%; padding-right: 40px; box-sizing: border-box; }
  .password-toggle-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none; font-size: 16px; }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    function setupToggle(iconId, inputId) {
      const icon = document.getElementById(iconId);
      const input = document.getElementById(inputId);
      icon.addEventListener('click', function () {
        const isPassword = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPassword ? 'text' : 'password');
        icon.textContent = isPassword ? '🙈' : '👁️';
      });
    }
    setupToggle('toggleNewPassword', 'new_password');
    setupToggle('toggleConfirmPassword', 'confirm_password');
  });
</script>
{% endblock %}

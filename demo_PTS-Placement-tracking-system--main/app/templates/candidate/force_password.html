<!doctype html>
<html lang="{{ current_language() }}">
<head>
  <meta charset="utf-8">
  <title>{{ _('candidate_portal') }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <h2>Set a new password</h2>
      <p>For security, please change your default password before continuing.</p>

      {% if error %}
        <p class="form-error">{{ error }}</p>
      {% endif %}

      <form method="post" class="auth-form">
        {% if csrf_token is defined %}
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% endif %}
        <input type="password" name="new_password" placeholder="New password" minlength="6" required autofocus>
        <input type="password" name="confirm_password" placeholder="Confirm password" minlength="6" required>
        <button type="submit" class="primary-btn">Save and continue</button>
      </form>

      <p style="margin-top:16px;"><a href="{{ url_for('frontend.candidate_logout') }}">Logout</a></p>
    </div>
  </div>
</body>
</html>

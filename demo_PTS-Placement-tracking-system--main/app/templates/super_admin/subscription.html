{% extends 'base.html' %}
{% block title %}Subscription - {{ organization.organization_name }}{% endblock %}

{% block content %}
<div class="page-header page-header-inline">
  <div>
    <h2>Subscription - {{ organization.organization_name }}</h2>
    <p>Manage plan, credits, and payment status.</p>
  </div>
  <a class="ghost-btn" href="{{ url_for('frontend.super_admin_organization_detail', organization_id=organization.id) }}">Back</a>
</div>

<div class="panel-card form-card">
  <form method="post" class="full-form">
    <div class="form-grid">
      <label>Subscription Plan ID<input type="number" name="subscription_plan_id" value="{{ organization.subscription_plan_id or '' }}"></label>
      <label>Subscription Expiry<input type="date" name="subscription_expiry_date" value="{{ organization.subscription_expiry_date.strftime('%Y-%m-%d') if organization.subscription_expiry_date else '' }}"></label>
      <label>Candidate Limit<input type="number" name="candidate_limit" value="{{ organization.candidate_limit or 0 }}"></label>
      <label>WhatsApp Credits<input type="number" name="whatsapp_credits" value="{{ organization.whatsapp_credits or 0 }}"></label>
      <label>SMS Credits<input type="number" name="sms_credits" value="{{ organization.sms_credits or 0 }}"></label>
      <label>Email Credits<input type="number" name="email_credits" value="{{ organization.email_credits or 0 }}"></label>
      <label>Payment Status
        <select name="payment_status">
          <option value="PENDING" {{ 'selected' if organization.payment_status == 'PENDING' }}>Pending</option>
          <option value="PAID" {{ 'selected' if organization.payment_status == 'PAID' }}>Paid</option>
          <option value="OVERDUE" {{ 'selected' if organization.payment_status == 'OVERDUE' }}>Overdue</option>
        </select>
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="primary-btn">Save Subscription</button>
    </div>
  </form>
</div>
{% endblock %}

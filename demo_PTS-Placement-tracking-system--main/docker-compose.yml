version: "3.9"

services:
  web:
    build: .
    command: gunicorn wsgi:app --bind 0.0.0.0:8000 --workers 2
    ports:
      - "8000:8000"
    environment:
      FLASK_ENV: development
      DATABASE_URL: mysql+pymysql://root:vanshika%403926@mysql:3306/placement_tracking
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: placement_tracking
      MYSQL_USER: root
      MYSQL_PASSWORD: "vanshika@3926"
      MYSQL_ROOT_PASSWORD: "vanshika@3926"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pvanshika@3926"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: